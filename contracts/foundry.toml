[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "prague"            # required for vm.signDelegation / EIP-7702 cheatcodes
optimizer = true
optimizer_runs = 200
# KEEP via_ir OFF: Safe v1.4.1 + solc 0.8.37 under via_ir hits "stack too deep".
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@safe/=lib/safe-smart-account/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[fmt]
line_length = 140
